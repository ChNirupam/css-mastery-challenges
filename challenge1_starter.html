<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge 1 - Animating the Answer</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow-x: hidden;
            color: #172033;
            background:
                radial-gradient(circle at top left, #dbeafe, transparent 42%),
                linear-gradient(135deg, #f8fafc, #e2e8f0);
            font-family: Arial, Helvetica, sans-serif;
        }

        main {
            width: min(92vw, 780px);
            padding: 3rem 2rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid #cbd5e1;
            border-radius: 22px;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.15);
        }

        h1 {
            margin: 0 0 2rem;
            color: #1e3a8a;
            font-size: clamp(1.55rem, 4vw, 2.35rem);
        }

        .equation {
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.25em;
            font-size: clamp(1.65rem, 5vw, 3rem);
            font-weight: 700;
            white-space: nowrap;
        }

        #question {
            display: inline-block;
            padding: 0.25rem 0.45rem;
            border-radius: 10px;
            cursor: pointer;
            transition: color 0.3s ease, background-color 0.3s ease,
                        transform 0.3s ease;
        }

        /* Required hover effect for the question. */
        #question:hover {
            color: #1d4ed8;
            background-color: #dbeafe;
            transform: scale(1.05);
        }

        #equals {
            color: #334155;
        }

        #answer {
            display: inline-block;
            /* Required: moveFraction begins after a one-second delay. */
            animation: moveFraction 3s ease-in-out 1s both;
        }

        /* Required three-stage fraction animation. */
        @keyframes moveFraction {
            0% {
                color: yellow;
                transform: translate(-355px, 60px);
            }

            50% {
                transform: translate(0px, 60px);
            }

            100% {
                color: red;
                transform: translate(0px, 0px);
            }
        }

        .hint {
            margin: 1rem 0 0;
            color: #64748b;
            font-size: 0.92rem;
        }

        @media (prefers-reduced-motion: reduce) {
            #answer {
                animation-duration: 0.01ms;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Animating the Answer</h1>

        <div class="equation" aria-label="What is one half plus one fourth? Equals three fourths.">
            <span id="question">What is 1/2 + 1/4?</span>
            <span id="equals">=</span>
            <span id="answer">3/4</span>
        </div>

        <p class="hint">Hover over the question for an extra effect. Refresh to replay the animation.</p>
    </main>
</body>
</html>
